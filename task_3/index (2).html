<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Workshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="header">
    <h1>Pendaftaran Workshop</h1>
    <p>Tugas Individu 3 - Pengembangan Aplikasi Web</p>
  </div>

  <div class="container">
    <div class="card">
      <h2>Formulir Pendaftaran</h2>

      <p class="note">
        Data dikirim dengan <strong>method GET</strong> ke halaman
        <code>detail.html</code> melalui query string pada URL.
      </p>

      <!-- Form dengan method GET: data dilempar lewat query string -->
      <form method="get" action="detail.html">

        <fieldset>
          <legend>Data Pribadi</legend>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="nama">Nama Lengkap</label>
              <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap"
                     pattern="[A-Za-z .]{3,}" title="Minimal 3 huruf" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="nim">NIM</label>
              <input type="text" id="nim" name="nim" placeholder="Contoh: 119140008"
                     pattern="[0-9]{9}" title="NIM terdiri dari 9 angka" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="tgl_lahir">Tanggal Lahir</label>
              <input type="date" id="tgl_lahir" name="tgl_lahir" required>
            </div>

            <div class="form-group full">
              <span class="form-label">Jenis Kelamin</span>
              <div class="option-row">
                <label for="laki">
                  <input type="radio" id="laki" name="jk" value="Laki-laki"> Laki-laki
                </label>
                <label for="perempuan">
                  <input type="radio" id="perempuan" name="jk" value="Perempuan"> Perempuan
                </label>
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Data Akademik</legend>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="prodi">Program Studi</label>
              <select id="prodi" name="prodi" required>
                <option value="">Pilih Program Studi</option>
                <optgroup label="Fakultas Teknologi Industri">
                  <option value="Teknik Informatika">Teknik Informatika</option>
                  <option value="Teknik Elektro">Teknik Elektro</option>
                </optgroup>
                <optgroup label="Fakultas Sains">
                  <option value="Sains Data">Sains Data</option>
                  <option value="Matematika">Matematika</option>
                </optgroup>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="telepon">Nomor Telepon</label>
              <input type="tel" id="telepon" name="telepon" placeholder="Contoh: 081234567890"
                     pattern="[0-9]{10,14}" title="10-14 digit angka" required>
            </div>

            <div class="form-group full">
              <span class="form-label">Minat / Hobi</span>
              <div class="option-row">
                <label for="h-motivasi">
                  <input type="checkbox" id="h-motivasi" name="minat" value="Motivasi"> Motivasi
                </label>
                <label for="h-css">
                  <input type="checkbox" id="h-css" name="minat" value="CSS"> CSS
                </label>
                <label for="h-web">
                  <input type="checkbox" id="h-web" name="minat" value="Web"> Web
                </label>
                <label for="h-data">
                  <input type="checkbox" id="h-data" name="minat" value="Data"> Data
                </label>
              </div>
            </div>

            <div class="form-group full">
              <label class="form-label" for="alasan">Alasan Mengikuti Workshop</label>
              <textarea id="alasan" name="alasan" placeholder="Tuliskan alasan mengikuti workshop"></textarea>
            </div>
          </div>
        </fieldset>

        <div class="button-row">
          <input type="reset" value="Reset">
          <input type="submit" value="Daftar">
        </div>

      </form>
    </div>
  </div>

  <div id="footer">Informatika ITERA &copy; 2025 - Tugas Individu 3 Pemweb</div>

</body>
</html>
